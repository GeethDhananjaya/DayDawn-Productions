# ==============================================================================
# DAYDAWN PRODUCTIONS - Production Nginx Configuration
# ==============================================================================

# Rate limiting zone for API requests
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

# Upstream Backend API
upstream daydawn_backend_upstream {
    server backend:5000;
    keepalive 32;
}

# Upstream Frontend Service (or static web root)
upstream daydawn_frontend_upstream {
    server frontend:80;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name daydawnproductions.com www.daydawnproductions.com localhost;

    # Redirect all HTTP traffic to HTTPS in production
    # return 301 https://$host$request_uri;

    # Root and index for direct static file serving
    root /var/www/daydawn/frontend/dist;
    index index.html;

    # Maximum file upload size for media / inquiries
    client_max_body_size 50M;

    # --------------------------------------------------------------------------
    # Compression (Gzip)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' http://localhost:5000 https:;" always;

    # --------------------------------------------------------------------------
    # Static Assets Caching (Vite hashed bundles in /assets/)
    # --------------------------------------------------------------------------
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Public static media
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|mp4|webm|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Reverse Proxy to Backend API
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://daydawn_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable buffering for fast streaming responses
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # Frontend SPA Fallback Routing
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check bypass
    location /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
