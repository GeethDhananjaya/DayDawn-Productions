version: '3.8'

services:
  # Nginx Reverse Proxy (Frontend + API Gateway)
  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    container_name: daydawn_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - daydawn_network
    volumes:
      - ./nginx/daydawn.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx

  # Frontend (Vite Production Build served via internal Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: daydawn_frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - daydawn_network

  # Backend (Node.js / Express REST API)
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: daydawn_backend
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgres://${DB_USER:-daydawn_user}:${DB_PASSWORD:-daydawn_secure_password}@postgres:5432/${DB_NAME:-daydawn_db}
      - CLIENT_URL=http://localhost
    depends_on:
      - postgres
    networks:
      - daydawn_network

  # Database (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: daydawn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-daydawn_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-daydawn_secure_password}
      POSTGRES_DB: ${DB_NAME:-daydawn_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - daydawn_network

networks:
  daydawn_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
